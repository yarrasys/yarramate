format: yarramate/v1
id: yarramate-engine
profile: yarramate/development@1.0
concepts:
  - id: compiler
    kind: compiler-module
    name: Native compiler
    description: Loads native YAML and produces the tool-neutral semantic graph.
    status: current
    owner: yarramate-product#yarramate-maintainers
    constraints:
      - id: tool-neutral
        ref: yarramate-product#tool-neutral-core
      - id: deterministic
        ref: yarramate-product#deterministic-correctness
  - id: cli
    kind: compiler-module
    name: YarraMate CLI
    description: Stable repository-native interface over compiler behavior.
    status: current
    owner: yarramate-product#yarramate-maintainers
    constraints:
      - id: stable-interface
        ref: yarramate-product#stable-cli
  - id: profile-catalogue
    kind: compiler-module
    name: Native profile catalogue
    description: Supplies known concept kinds and broad relationship policies.
    status: current
  - id: workspace-loader
    kind: compiler-module
    name: Workspace manifest loader
    description: Resolves explicit local source patterns deterministically without repository discovery.
    status: current
    owner: yarramate-product#yarramate-maintainers
    constraints:
      - id: repository-native
        ref: yarramate-product#repository-native-operation
  - id: evidence-evaluator
    kind: compiler-module
    name: Evidence evaluator
    description: Evaluates provider observations against existing graph subjects and claims.
    status: current
    owner: yarramate-product#yarramate-maintainers
    constraints:
      - id: tool-neutral
        ref: yarramate-product#tool-neutral-core
  - id: source-document-loader
    kind: compiler-module
    name: Source-located document loader
    description: Centralizes YAML parsing, normative schema validation, and deterministic source-located diagnostics.
    status: current
    owner: yarramate-product#yarramate-maintainers
  - id: parse-document
    kind: applicationFunction
    name: Parse native document
    status: current
  - id: load-source-document
    kind: applicationFunction
    name: Load source document
    description: Parses and validates one schema-backed YAML source while retaining authored locations.
    status: current
  - id: validate-document-structure
    kind: applicationFunction
    name: Validate document structure
    status: current
  - id: validate-semantic-claims
    kind: applicationFunction
    name: Validate semantic claims
    status: current
  - id: validate-adapter-mapping
    kind: applicationFunction
    name: Validate adapter mapping
    description: Checks optional subject mappings without changing the native semantic graph.
    status: current
  - id: compile-semantic-graph
    kind: applicationFunction
    name: Compile semantic graph
    status: current
  - id: serialize-semantic-graph
    kind: applicationFunction
    name: Serialize semantic graph
    description: Emits canonical graph-v2 JSON for adapters, agents, and CI.
    status: current
  - id: resolve-workspace
    kind: applicationFunction
    name: Resolve workspace manifest
    description: Expands safe relative patterns into typed, sorted source paths.
    status: current
  - id: evaluate-evidence
    kind: applicationFunction
    name: Evaluate evidence overlay
    description: Produces a deterministic report without modifying graph v2.
    status: current
  - id: check-command
    kind: applicationService
    name: Check command
    description: Reports deterministic source-located diagnostics without writing compiled output.
    status: current
  - id: init-command
    kind: applicationService
    name: Init command
    description: Creates a minimal native workspace without overwriting an existing document.
    status: current
  - id: add-command
    kind: applicationService
    name: Add command
    description: Adds a concept only when the candidate workspace compiles successfully.
    status: current
  - id: connect-command
    kind: applicationService
    name: Connect command
    description: Adds a relationship only when the candidate workspace compiles successfully.
    status: current
  - id: compile-command
    kind: applicationService
    name: Compile command
    description: Emits the normative graph-v2 interchange document without writing a derived artifact.
    status: current
  - id: evidence-command
    kind: applicationService
    name: Evidence command
    description: Evaluates one evidence document over compiled native sources.
    status: current
  - id: native-document
    kind: dataObject
    name: Native YAML document
    status: current
  - id: document-schema
    kind: dataObject
    name: Native document JSON Schema
    status: current
  - id: kind-catalogue
    kind: dataObject
    name: Concept kind catalogue
    status: current
  - id: relationship-policy-catalogue
    kind: dataObject
    name: Relationship policy catalogue
    status: current
  - id: semantic-graph
    kind: dataObject
    name: Tool-neutral semantic graph
    status: current
  - id: diagnostics
    kind: dataObject
    name: Source-located diagnostics
    status: current
  - id: check-result
    kind: dataObject
    name: Machine-readable check result
    status: current
  - id: check-result-schema
    kind: dataObject
    name: Check result JSON Schema
    status: current
  - id: adapter-mapping
    kind: dataObject
    name: Optional adapter mapping
    description: Versioned correspondence between globally qualified native subjects and external identities.
    status: current
  - id: adapter-mapping-schema
    kind: dataObject
    name: Adapter mapping JSON Schema
    status: current
  - id: semantic-graph-schema
    kind: dataObject
    name: Semantic graph v2 JSON Schema
    status: current
  - id: projection-definition
    kind: dataObject
    name: Semantic projection definition
    status: current
  - id: projection-schema
    kind: dataObject
    name: Projection definition JSON Schema
    status: current
  - id: projection-result
    kind: dataObject
    name: Deterministic projection result
    status: current
  - id: projection-result-schema
    kind: dataObject
    name: Projection result JSON Schema
    status: current
  - id: workspace-manifest
    kind: dataObject
    name: Workspace manifest
    status: current
  - id: workspace-schema
    kind: dataObject
    name: Workspace manifest JSON Schema
    status: current
  - id: evidence-document
    kind: dataObject
    name: Evidence overlay document
    status: current
  - id: evidence-report
    kind: dataObject
    name: Deterministic evidence report
    status: current
  - id: evidence-schema
    kind: dataObject
    name: Evidence overlay JSON Schema
    status: current
  - id: evidence-report-schema
    kind: dataObject
    name: Evidence report JSON Schema
    status: current
relationships:
  - id: compiler-delivers-compilation
    kind: implements
    from: compiler
    to: yarramate-product#compile-native-architecture
  - id: compiler-delivers-validation
    kind: implements
    from: compiler
    to: yarramate-product#validate-native-architecture
  - id: graph-delivers-machine-context
    kind: realization
    from: semantic-graph
    to: yarramate-product#provide-machine-context
  - id: compiler-parses
    kind: assignment
    from: compiler
    to: parse-document
  - id: compiler-validates-structure
    kind: assignment
    from: compiler
    to: validate-document-structure
  - id: compiler-validates-semantics
    kind: assignment
    from: compiler
    to: validate-semantic-claims
  - id: cli-validates-adapter-mapping
    kind: assignment
    from: cli
    to: validate-adapter-mapping
  - id: compiler-builds-graph
    kind: assignment
    from: compiler
    to: compile-semantic-graph
  - id: compiler-serializes-graph
    kind: assignment
    from: compiler
    to: serialize-semantic-graph
  - id: workspace-loader-resolves-manifest
    kind: assignment
    from: workspace-loader
    to: resolve-workspace
  - id: evidence-evaluator-evaluates-overlay
    kind: assignment
    from: evidence-evaluator
    to: evaluate-evidence
  - id: source-loader-loads-document
    kind: assignment
    from: source-document-loader
    to: load-source-document
  - id: cli-provides-check
    kind: implements
    from: cli
    to: check-command
  - id: cli-provides-init
    kind: implements
    from: cli
    to: init-command
  - id: cli-provides-add
    kind: implements
    from: cli
    to: add-command
  - id: cli-provides-connect
    kind: implements
    from: cli
    to: connect-command
  - id: cli-provides-compile
    kind: implements
    from: cli
    to: compile-command
  - id: cli-provides-evidence
    kind: implements
    from: cli
    to: evidence-command
  - id: parse-reads-native-document
    kind: access
    from: parse-document
    to: native-document
    mode: read
  - id: validation-reads-schema
    kind: access
    from: validate-document-structure
    to: document-schema
    mode: read
  - id: semantic-validation-reads-kinds
    kind: access
    from: validate-semantic-claims
    to: kind-catalogue
    mode: read
  - id: semantic-validation-reads-policies
    kind: access
    from: validate-semantic-claims
    to: relationship-policy-catalogue
    mode: read
  - id: parse-triggers-structure-validation
    kind: triggering
    from: parse-document
    to: validate-document-structure
  - id: structure-triggers-semantic-validation
    kind: triggering
    from: validate-document-structure
    to: validate-semantic-claims
  - id: semantic-validation-triggers-compilation
    kind: triggering
    from: validate-semantic-claims
    to: compile-semantic-graph
  - id: parser-flows-document
    kind: flow
    from: parse-document
    to: validate-document-structure
    content: Parsed document
  - id: semantic-validation-flows-diagnostics
    kind: flow
    from: validate-semantic-claims
    to: check-command
    content: Diagnostics
  - id: check-command-writes-result
    kind: access
    from: check-command
    to: check-result
    mode: write
  - id: check-command-reads-result-schema
    kind: access
    from: check-command
    to: check-result-schema
    mode: read
  - id: compilation-writes-graph
    kind: access
    from: compile-semantic-graph
    to: semantic-graph
    mode: write
  - id: serialization-reads-graph
    kind: access
    from: serialize-semantic-graph
    to: semantic-graph
    mode: read
  - id: serialization-reads-graph-schema
    kind: access
    from: serialize-semantic-graph
    to: semantic-graph-schema
    mode: read
  - id: workspace-resolution-reads-manifest
    kind: access
    from: resolve-workspace
    to: workspace-manifest
    mode: read
  - id: workspace-resolution-reads-schema
    kind: access
    from: resolve-workspace
    to: workspace-schema
    mode: read
  - id: cli-uses-workspace-loader
    kind: association
    from: cli
    to: workspace-loader
    name: Explicit source resolution
  - id: evidence-evaluator-delivers-capability
    kind: implements
    from: evidence-evaluator
    to: yarramate-product#evaluate-architecture-evidence
  - id: evidence-evaluation-reads-document
    kind: access
    from: evaluate-evidence
    to: evidence-document
    mode: read
  - id: evidence-evaluation-reads-graph
    kind: access
    from: evaluate-evidence
    to: semantic-graph
    mode: read
  - id: evidence-evaluation-reads-schema
    kind: access
    from: evaluate-evidence
    to: evidence-schema
    mode: read
  - id: evidence-evaluation-writes-report
    kind: access
    from: evaluate-evidence
    to: evidence-report
    mode: write
  - id: evidence-evaluation-reads-report-schema
    kind: access
    from: evaluate-evidence
    to: evidence-report-schema
    mode: read
  - id: validation-writes-diagnostics
    kind: access
    from: validate-semantic-claims
    to: diagnostics
    mode: write
  - id: adapter-validation-reads-mapping
    kind: access
    from: validate-adapter-mapping
    to: adapter-mapping
    mode: read
  - id: adapter-validation-reads-graph
    kind: access
    from: validate-adapter-mapping
    to: semantic-graph
    mode: read
  - id: adapter-validation-reads-schema
    kind: access
    from: validate-adapter-mapping
    to: adapter-mapping-schema
    mode: read
  - id: profile-supplies-kinds
    kind: access
    from: profile-catalogue
    to: kind-catalogue
    mode: write
  - id: profile-supplies-policies
    kind: access
    from: profile-catalogue
    to: relationship-policy-catalogue
    mode: write
