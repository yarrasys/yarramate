      system:           { kind: "yarramate/core@0.1#applicationComponent", kindMatching: descendants }
      timeout:          { kind: "aperturex/mule@1.0#timeout-constraint" }
      retry:            { kind: "aperturex/mule@1.0#retry-constraint" }
    wiring:
      - { from: self,       kind: "yarramate/core@0.1#association",  to: system }
  - kind: "aperturex/consulting@1.0#custom-connector"
    parts:
      system:           { kind: "yarramate/core@0.1#applicationComponent", kindMatching: descendants }
      timeout:          { kind: "aperturex/mule@1.0#timeout-constraint" }
      retry:            { kind: "aperturex/mule@1.0#retry-constraint" }
    wiring:
      - { from: self,       kind: "yarramate/core@0.1#association",  to: system }

