  - id: spec-attendance-to-sf
    kind: artifact
    name: "Attendance record → Patron_Attendance__c mapping spec"
    description: "aperturex/mapping-spec/v1 for map-attendance-to-sf, in the document library."
  - id: spec-attendance-list
    kind: artifact
    name: "Patron_Attendance__c → attendance list mapping spec"
