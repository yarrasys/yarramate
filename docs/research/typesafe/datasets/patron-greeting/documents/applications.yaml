    description: "aperturex/mapping-spec/v1 for map-attendances-to-digest, in the document library."
  - id: spec-digest-email
    kind: artifact
    name: "Attendance digest → email mapping spec"
    description: "aperturex/mapping-spec/v1 for map-digest-to-email, in the document library."
  - id: spec-teams-card
    kind: artifact
    name: "Arrival event → Teams card mapping spec"
    description: "aperturex/mapping-spec/v1 for map-arrival-to-teams-card, in the document library."
  - id: spec-tee-sheet-row
    kind: artifact
