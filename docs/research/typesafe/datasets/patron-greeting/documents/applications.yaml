format: yarramate/v1
id: applications
profile: aperturex/mule@1.0
# The eight applications, each with its contract (an API and its operations), the calls it makes
# (a client per callee, a request per callee operation, a connector read or write per platform
# object, a publish per destination), and the mappings that exist only where a call crosses a
# contract (ADR 0011). What an application DOES is edges at the bottom: it is assigned each of its
# functions, realizes each operation it exposes, and a flow realizes the operation it implements.
concepts:
  # ── patron-checkin-xapi ──────────────────────────────────────────────────────────────────────────
  - id: patron-checkin-xapi
    kind: mule-http-api
    name: "patron-checkin-xapi"
    description: "Experience API. What the tablet calls; shapes the greeting for a screen. Public ingress. Repository fgc/patron-checkin-xapi."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: logs-30d
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-framework
      interface: patron-checkin-api
      api-layer: layer-experience
      secrets: xapi-secrets
      observability: obs-standard
      cache: patron-lookup-cache
      auth: jwt-entra
      rate-limit: rate-60-per-min
      idempotency: idem-key-header
      throughput: thr-xapi
      latency: lat-xapi
      payload-limit: payload-256kb
      detection: detect-5min
      compatibility: api-versioning-v1
  - id: patron-checkin-api
    kind: mule-api
    name: "patron-checkin-api v1"
    description: "RAML 1.0 in Exchange. GET /patrons?membershipNumber · GET /patrons/{id}/greeting · POST /patrons/{id}/attendances. Traits from fgc-api-fragments; contract tests via the Exchange mocking service."
    parts:
      specification: raml-patron-checkin
    constraints:
      - { id: auth, ref: jwt-entra }
      - { id: rate, ref: rate-60-per-min }
      - { id: idem, ref: idem-key-header }
  - id: raml-patron-checkin
    kind: artifact
    name: "patron-checkin-api RAML"
    description: "RAML 1.0 published to Anypoint Exchange; the contract the tablet builds against."
  - id: op-checkin-find-patron
    kind: mule-api-operation
    name: "GET /patrons?membershipNumber"
    description: "Looks a patron up by membership number before the card tap is committed. Passed through to the process API unchanged."
    parts:
      request: membership-lookup
      response: patron-record
  - id: op-checkin-greeting
    kind: mule-api-operation
    name: "GET /patrons/{id}/greeting"
    description: "Re-fetches the greeting for a screen that was refreshed; composed from what the tablet already holds."
    parts:
      request: greeting-request
      response: greeting-view
  - id: op-checkin-attendance
    kind: mule-api-operation
    name: "POST /patrons/{id}/attendances"
    description: "The card tap: records the attendance through the process API and returns the greeting shaped for the tablet."
    parts:
      request: checkin-request
      response: greeting-view
  - id: patron-checkin-service
    kind: applicationService
    name: "Patron Check-in Service"
    description: "The capability the tablet consumes, as one service; the operations beside it are its contract."
  - id: compose-greeting-view
    kind: applicationFunction
    name: "Compose Greeting View"
    description: "Shapes the greeting for a screen. Internal — never a boundary."
  - id: client-xapi-papi
    kind: mule-http-client
    name: "HTTP client → patron-attendance-api"
    description: "One HTTP Request configuration: host, TLS, client-id headers, the shared timeout budget and bounded retry."
    parts:
      api: patron-attendance-api
      timeout: timeout-standard
      retry: retry-bounded
  - id: req-xapi-record-attendance
    kind: mule-http-request
    name: "Call record attendance"
    description: "The card tap forwarded: the check-in request shaped into an attendance request, the greeting shaped back for the tablet."
    parts:
      client: client-xapi-papi
      operation: op-papi-record-attendance
      request-mapping: map-patron-attendance-request
      response-mapping: map-greeting-to-tablet-view
  - id: req-xapi-find-patron
    kind: mule-http-request
    name: "Call find patron"
    description: "Pass-through: the lookup and the patron record cross unchanged, so neither mapping exists — dismissed with that reason."
    parts:
      client: client-xapi-papi
      operation: op-papi-find-patron
  - id: map-greeting-to-tablet-view
    kind: mapping-application-function
    name: "Map Greeting to Tablet View"
    description: "DataWeave."
    parts:
      source: greeting
      target: greeting-view
      specification: spec-greeting-view
  - id: map-patron-attendance-request
    kind: mapping-application-function
    name: "Map Check-in Request to Attendance Request"
    description: "DataWeave; MUnit assertions in src/test/munit. The caller's request mapping — it writes the process API's request object."
    parts:
      source: checkin-request
      target: attendance-request
      specification: spec-attendance-request
  - id: greeting
    kind: dataObject
    name: "Greeting"
    description: "Name, membership tier, tee time, recent purchase, welcome line. What the process API returns."
  - id: greeting-sample
    kind: sample-data-object
    name: "Greeting sample"
    description: "Redacted real payload from a call that happened."
  # ── patron-attendance-papi ───────────────────────────────────────────────────────────────────────
  - id: patron-attendance-papi
    kind: mule-http-api
    name: "patron-attendance-papi"
    description: "Process API. Look up the patron, compose the greeting, record the attendance exactly once per day, publish the arrival event. Private. Repository fgc/patron-attendance-papi."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: logs-30d
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-framework
      interface: patron-attendance-api
      api-layer: layer-process
      secrets: papi-secrets
      observability: obs-standard
      auth: client-id-private
      idempotency: idem-one-per-day
      throughput: thr-papi
      latency: lat-papi
      payload-limit: payload-256kb
      detection: detect-5min
      compatibility: api-versioning-v1
  - id: patron-attendance-api
    kind: mule-api
    name: "patron-attendance-api v1"
    description: "RAML 1.0 in Exchange. No public endpoint."
    parts:
      specification: raml-patron-attendance
    constraints:
      - { id: auth, ref: client-id-private }
      - { id: idem, ref: idem-one-per-day }
  - id: raml-patron-attendance
    kind: artifact
    name: "patron-attendance-api RAML"
    description: "RAML 1.0 published to Anypoint Exchange, private."
  - id: op-papi-record-attendance
    kind: mule-api-operation
    name: "POST /attendances"
    description: "Records one attendance per patron per day and returns the composed greeting."
    parts:
      request: attendance-request
      response: greeting
  - id: op-papi-find-patron
    kind: mule-api-operation
    name: "GET /patrons?membershipNumber"
    description: "Looks the patron up in the system API; the record is returned as the tiers see it."
    parts:
      request: membership-lookup
      response: patron-record
  - id: patron-attendance-service
    kind: applicationService
    name: "Patron Attendance Service"
    description: "The capability — exposed by the API. This is the subject the consultant's report was about; the operations beside it are its contract."
  - id: record-patron-attendance
    kind: applicationFunction
    name: "Record Patron Attendance"
    description: "The main flow: reached only through the boundaries, never asked how it is authenticated. Composes the calls below."
  - id: compose-greeting
    kind: applicationFunction
    name: "Compose Greeting"
    description: "Assembles patron, tee time and purchase context."
  - id: client-papi-sapi
    kind: mule-http-client
    name: "HTTP client → salesforce-patron-api"
    description: "One HTTP Request configuration to the system API; the shared timeout budget and bounded retry."
    parts:
      api: salesforce-patron-api
      timeout: timeout-standard
      retry: retry-bounded
  - id: req-papi-query-patron
    kind: mule-http-request
    name: "Call query patron for the greeting"
    description: "From the attendance request, the patron query; from the patron record, the greeting."
    parts:
      client: client-papi-sapi
      operation: op-sapi-query-patron
      request-mapping: map-attendance-to-patron-query
      response-mapping: map-patron-to-greeting
  - id: req-papi-find-patron
    kind: mule-http-request
    name: "Call query patron for the lookup"
    description: "The lookup shaped into the patron query; the patron record passes through unchanged."
    parts:
      client: client-papi-sapi
      operation: op-sapi-query-patron
      request-mapping: map-lookup-to-patron-query
  - id: req-papi-upsert-attendance
    kind: mule-http-request
    name: "Call upsert attendance"
    description: "The attendance request shaped into the system API's attendance record; the acknowledgement carries nothing to map."
    parts:
      client: client-papi-sapi
      operation: op-sapi-upsert-attendance
      request-mapping: map-attendance-to-record
  - id: pub-papi-arrival
    kind: mule-publish
    name: "Publish arrival event"
    description: "After the attendance is recorded: patronId, arrivedAt, membership tier, tabletId onto Anypoint MQ patron-arrivals."
    parts:
      destination: patron-arrivals
      event: arrival-event
      event-mapping: map-attendance-to-arrival
  - id: map-attendance-to-patron-query
    kind: mapping-application-function
    name: "Map Attendance Request to Patron Query"
    parts:
      source: attendance-request
      target: patron-query
      specification: spec-patron-query
  - id: map-lookup-to-patron-query
    kind: mapping-application-function
    name: "Map Membership Lookup to Patron Query"
    parts:
      source: membership-lookup
      target: patron-query
      specification: spec-lookup-query
  - id: map-patron-to-greeting
    kind: mapping-application-function
    name: "Map Patron Record to Greeting"
    parts:
      source: patron-record
      target: greeting
      specification: spec-patron-to-greeting
  - id: map-attendance-to-record
    kind: mapping-application-function
    name: "Map Attendance Request to Attendance Record"
    parts:
      source: attendance-request
      target: attendance-record
      specification: spec-attendance-record
  - id: map-attendance-to-arrival
    kind: mapping-application-function
    name: "Map Attendance Request to Arrival Event"
    parts:
      source: attendance-request
      target: arrival-event
      specification: spec-arrival-event
  - id: attendance-request
    kind: dataObject
    name: "Attendance request"
    description: "patronId, arrivedAt, tabletId, Idempotency-Key."
  - id: attendance-request-sample
    kind: sample-data-object
    name: "Attendance request sample"
  # ── salesforce-patron-sapi ───────────────────────────────────────────────────────────────────────
  - id: salesforce-patron-sapi
    kind: mule-http-api
    name: "salesforce-patron-sapi"
    description: "System API. The only application that speaks to Salesforce: contacts, memberships, attendance, purchases, cases, expected arrivals. Hides SOQL and API limits. Private. Repository fgc/salesforce-patron-sapi."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: logs-30d
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-salesforce
      interface: salesforce-patron-api
      backend: salesforce-connector
      api-layer: layer-system
      secrets: sapi-secrets
      observability: obs-sapi
      cache: patron-lookup-cache
      auth: client-id-private
      idempotency: idem-external-id
      throughput: thr-sapi
      latency: lat-sapi
      payload-limit: payload-256kb
      detection: detect-5min
      compatibility: api-versioning-v1
  - id: salesforce-patron-api
    kind: mule-api
    name: "salesforce-patron-api v1"
    description: "RAML 1.0 in Exchange. Consumed by the process API, the digest job, the tee-sheet import, the POS poller and the mailbox reader."
    parts:
      specification: raml-salesforce-patron
    constraints:
      - { id: auth, ref: client-id-private }
      - { id: idem, ref: idem-external-id }
  - id: raml-salesforce-patron
    kind: artifact
    name: "salesforce-patron-api RAML"
    description: "RAML 1.0 published to Anypoint Exchange, private. One resource per Salesforce concern."
  - id: op-sapi-query-patron
    kind: mule-api-operation
    name: "GET /patrons"
    description: "Contact and membership behind the 15-minute cache, returned as the canonical patron record."
    parts:
      request: patron-query
      response: patron-record
  - id: op-sapi-upsert-attendance
    kind: mule-api-operation
    name: "PUT /attendances/{key}"
    description: "External-id upsert; the acknowledgement carries the Salesforce id and nothing else."
    parts:
      request: attendance-record
      response: operation-ack
  - id: op-sapi-list-attendances
    kind: mule-api-operation
    name: "GET /attendances?date"
    description: "A day's attendances, for the digest."
    parts:
      request: attendance-query
      response: attendance-list
  - id: op-sapi-record-purchase
    kind: mule-api-operation
    name: "PUT /purchases/{id}"
    description: "One pro-shop purchase, keyed by the POS purchase id."
    parts:
      request: purchase-record
      response: operation-ack
  - id: op-sapi-create-case
    kind: mule-api-operation
    name: "POST /cases"
    description: "A guest enquiry becomes a Case; the case number comes back for the acknowledgement."
    parts:
      request: case-request
      response: case-record
  - id: op-sapi-upsert-expected-arrival
    kind: mule-api-operation
    name: "PUT /expected-arrivals/{booking}"
    description: "One tee-sheet booking, keyed by the vendor's booking reference."
    parts:
      request: expected-arrival
      response: operation-ack
  - id: salesforce-patron-service
    kind: applicationService
    name: "Salesforce Patron Service"
    description: "The system capability, as one service; the operations beside it are its contract."
  - id: call-sapi-query-contact
    kind: mule-connector-read
    name: "Query Contact and Membership__c"
    description: "SOQL on Contact, joined to Membership__c, behind the 15-minute cache. Query parameters are not a mapping."
    parts:
      connector: salesforce-connector
      object: sf-contact
      read-mapping: map-contact-to-patron
  - id: call-sapi-upsert-attendance
    kind: mule-connector-write
    name: "Upsert Patron_Attendance__c"
    description: "External-id upsert on Attendance_Key__c."
    parts:
      connector: salesforce-connector
      object: sf-patron-attendance
      write-mapping: map-attendance-to-sf
  - id: call-sapi-list-attendances
    kind: mule-connector-read
    name: "Query Patron_Attendance__c by date"
    parts:
      connector: salesforce-connector
      object: sf-patron-attendance
      read-mapping: map-attendances-to-list
  - id: call-sapi-upsert-purchase
    kind: mule-connector-write
    name: "Upsert Patron_Purchase__c"
    parts:
      connector: salesforce-connector
      object: sf-patron-purchase
      write-mapping: map-purchase
  - id: call-sapi-create-case
    kind: mule-connector-write
    name: "Create Case"
    parts:
      connector: salesforce-connector
      object: sf-case
      write-mapping: map-case-to-sf
  - id: call-sapi-upsert-expected-arrival
    kind: mule-connector-write
    name: "Upsert Expected_Arrival__c"
    parts:
      connector: salesforce-connector
      object: sf-expected-arrival
      write-mapping: map-expected-arrival-to-sf
  - id: map-contact-to-patron
    kind: mapping-application-function
    name: "Map Contact to Patron"
    parts:
      source: sf-contact
      target: patron-record
      specification: spec-contact-to-patron
  - id: map-attendance-to-sf
    kind: mapping-application-function
    name: "Map Attendance Record to Patron_Attendance__c"
    parts:
      source: attendance-record
      target: sf-patron-attendance
      specification: spec-attendance-to-sf
  - id: map-attendances-to-list
    kind: mapping-application-function
    name: "Map Patron_Attendance__c rows to Attendance List"
    parts:
      source: sf-patron-attendance
      target: attendance-list
      specification: spec-attendance-list
  - id: map-purchase
    kind: mapping-application-function
    name: "Map Purchase Record to Patron_Purchase__c"
    parts:
      source: purchase-record
      target: sf-patron-purchase
      specification: spec-purchase
  - id: map-case-to-sf
    kind: mapping-application-function
    name: "Map Case Request to Case"
    parts:
      source: case-request
      target: sf-case
      specification: spec-case-to-sf
  - id: map-expected-arrival-to-sf
    kind: mapping-application-function
    name: "Map Expected Arrival to Expected_Arrival__c"
    parts:
      source: expected-arrival
      target: sf-expected-arrival
      specification: spec-expected-arrival-sf
  - id: patron-record
    kind: dataObject
    name: "Patron record"
    description: "The canonical patron as the tiers see it."
  - id: patron-record-sample
    kind: sample-data-object
    name: "Patron record sample"
  # ── attendance-digest-job ────────────────────────────────────────────────────────────────────────
  - id: attendance-digest-job
    kind: mule-scheduled-job
    name: "attendance-digest-job"
    description: "Scheduled job. Yesterday's attendance summary emailed to the Guest Services Manager at 06:00. Repository fgc/attendance-digest-job."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: logs-30d
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-framework
      payload: attendance-digest
      sample: attendance-digest-sample
      backend: email-connector
      secrets: job-secrets
      observability: obs-job
      idempotency: idem-by-date
      run-window: run-0600-0630
      runtime-limit: max-15min
      overlap: overlap-skip
      catch-up: catchup-manual
      volume: vol-digest
      completion: complete-0630
      detection: detect-30min
  - id: summarise-attendance
    kind: applicationFunction
    name: "Summarise Attendance"
    description: "The main flow: list the day through the system API, summarise, send."
  - id: client-digest-sapi
    kind: mule-http-client
    name: "HTTP client → salesforce-patron-api (digest)"
    parts:
      api: salesforce-patron-api
      timeout: timeout-standard
      retry: retry-bounded
  - id: req-digest-list-attendances
    kind: mule-http-request
    name: "Call list attendances"
    description: "The date is a query parameter, not a mapping; the list is shaped into the digest."
    parts:
      client: client-digest-sapi
      operation: op-sapi-list-attendances
      response-mapping: map-attendances-to-digest
  - id: call-digest-send-email
    kind: mule-connector-write
    name: "Send digest email"
    parts:
      connector: email-connector
      object: digest-email
      write-mapping: map-digest-to-email
  - id: map-attendances-to-digest
    kind: mapping-application-function
    name: "Map Attendance List to Digest"
    parts:
      source: attendance-list
      target: attendance-digest
      specification: spec-attendance-digest
  - id: map-digest-to-email
    kind: mapping-application-function
    name: "Map Digest to Email"
    parts:
      source: attendance-digest
      target: digest-email
      specification: spec-digest-email
  - id: attendance-digest
    kind: dataObject
    name: "Attendance digest"
    description: "Counts by tier, first-time visitors, no-shows against the tee sheet."
  - id: attendance-digest-sample
    kind: sample-data-object
    name: "Digest sample"
  # ── patron-arrival-notifier ──────────────────────────────────────────────────────────────────────
  - id: patron-arrival-notifier
    kind: mule-event-listener
    name: "patron-arrival-notifier"
    description: "Event listener on Anypoint MQ patron-arrivals. Posts a greeting card to the pro-shop Teams channel so staff away from the desk know who has arrived. Repository fgc/patron-arrival-notifier."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: logs-30d
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-framework
      subscription: patron-arrivals
      target: pro-shop-teams
      payload: arrival-event
      sample: arrival-event-sample
      secrets: listener-secrets
      observability: obs-listener
      idempotency: idem-message-id
      delivery: at-least-once
      ordering: ordering-none
      redelivery: redeliver-3x30s
      dlq: dlq-4h
      ttl: ttl-1h
      backlog: backlog-100
      throughput: thr-listener
      latency: lat-listener
      detection: detect-5min
  - id: notify-arrival
    kind: applicationFunction
    name: "Notify Arrival"
    description: "The main flow: one message in, one card out."
  - id: client-notifier-teams
    kind: mule-http-client
    name: "HTTP client → Teams incoming webhook"
    description: "The webhook URL is the credential and lives in the secret set."
    parts:
      api: teams-webhook-api
      timeout: timeout-standard
      retry: retry-bounded
  - id: req-notifier-post-card
    kind: mule-http-request
    name: "Post greeting card"
    description: "The arrival event shaped into an Adaptive Card; the webhook answers with a bare 1, nothing to map."
    parts:
      client: client-notifier-teams
      operation: op-teams-post-message
      request-mapping: map-arrival-to-teams-card
  - id: map-arrival-to-teams-card
    kind: mapping-application-function
    name: "Map Arrival to Teams Card"
    parts:
      source: arrival-event
      target: teams-card
      specification: spec-teams-card
  - id: arrival-event
    kind: dataObject
    name: "Arrival event"
    description: "Published by the process API after an attendance is recorded."
  - id: arrival-event-sample
    kind: sample-data-object
    name: "Arrival event sample"
  # ── tee-sheet-import ─────────────────────────────────────────────────────────────────────────────
  - id: tee-sheet-import
    kind: mule-file-transfer
    name: "tee-sheet-import"
    description: "File transfer. The booking vendor exports the day's tee sheet as CSV; expected arrivals and tee times land in Salesforce through the system API so the greeting can mention them. Repository fgc/tee-sheet-import."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: ret-30-90
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-framework
      source: vendor-tee-sheet-sftp
      payload: expected-arrival
      sample: tee-sheet-sample
      backend: sftp-connector
      secrets: ft-secrets
      observability: obs-ft
      idempotency: idem-file-checksum
      partial-failure: row-quarantine
      duplicate: dup-filename-sha256
      arrival-window: arrive-0400-0500
      cadence: poll-15min
      size: size-2mb
      processing-budget: budget-5min
      detection: detect-30min
  - id: import-tee-sheet
    kind: applicationFunction
    name: "Import Tee Sheet"
    description: "The main flow: read the file, one expected arrival per row, upsert each through the system API."
  - id: call-teesheet-read
    kind: mule-connector-read
    name: "Read tee sheet CSV"
    parts:
      connector: sftp-connector
      object: tee-sheet-row
      read-mapping: map-tee-sheet-row
  - id: client-teesheet-sapi
    kind: mule-http-client
    name: "HTTP client → salesforce-patron-api (tee sheet)"
    parts:
      api: salesforce-patron-api
      timeout: timeout-standard
      retry: retry-bounded
  - id: req-teesheet-upsert-arrival
    kind: mule-http-request
    name: "Call upsert expected arrival"
    description: "Pass-through: the expected arrival IS the system API's request object; the acknowledgement carries nothing to map."
    parts:
      client: client-teesheet-sapi
      operation: op-sapi-upsert-expected-arrival
  - id: map-tee-sheet-row
    kind: mapping-application-function
    name: "Map Tee Sheet Row to Expected Arrival"
    parts:
      source: tee-sheet-row
      target: expected-arrival
      specification: spec-tee-sheet-row
  - id: expected-arrival
    kind: dataObject
    name: "Expected arrival"
    description: "Patron, tee time, group. Also the system API's request object for PUT /expected-arrivals."
  - id: tee-sheet-sample
    kind: sample-data-object
    name: "Tee sheet sample"
    description: "One vendor CSV, redacted."
  # ── pos-purchase-poller ──────────────────────────────────────────────────────────────────────────
  - id: pos-purchase-poller
    kind: mule-db-poller
    name: "pos-purchase-poller"
    description: "Database poller on the pro-shop POS. Recent purchases so a returning patron can be thanked for last week's putter. Reaches the club LAN over the VPN. Repository fgc/pos-purchase-poller."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: logs-30d
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-framework
      source: pos-database
      payload: purchase
      sample: purchase-sample
      backend: db-connector
      secrets: poller-secrets
      observability: obs-poller
      idempotency: idem-purchase-id
      watermark: wm-purchase-id
      late-row: late-none
      cadence: poll-5min
      lag: lag-60min
      batch: batch-200
      query-budget: q-500ms
      connection-footprint: conn-2
      backfill: backfill-90d
      detection: detect-30min
  - id: sync-purchases
    kind: applicationFunction
    name: "Sync Purchases"
    description: "The main flow: poll past the watermark, one purchase record per row through the system API."
  - id: call-poller-read-purchases
    kind: mule-connector-read
    name: "Select purchases past the watermark"
    description: "The row is the purchase object as read; no mapping shapes it."
    parts:
      connector: db-connector
      object: purchase
  - id: client-poller-sapi
    kind: mule-http-client
    name: "HTTP client → salesforce-patron-api (POS)"
    parts:
      api: salesforce-patron-api
      timeout: timeout-standard
      retry: retry-bounded
  - id: req-poller-record-purchase
    kind: mule-http-request
    name: "Call record purchase"
    description: "The POS row shaped into the system API's purchase record; the acknowledgement carries nothing to map."
    parts:
      client: client-poller-sapi
      operation: op-sapi-record-purchase
      request-mapping: map-purchase-to-record
  - id: map-purchase-to-record
    kind: mapping-application-function
    name: "Map Purchase to Purchase Record"
    parts:
      source: purchase
      target: purchase-record
      specification: spec-purchase-record
  - id: purchase
    kind: dataObject
    name: "Purchase"
    description: "One purchases row."
  - id: purchase-sample
    kind: sample-data-object
    name: "Purchase sample"
  # ── enquiry-mailbox-reader ───────────────────────────────────────────────────────────────────────
  - id: enquiry-mailbox-reader
    kind: mule-app
    name: "enquiry-mailbox-reader"
    description: "Generic application on an IMAP trigger. Guest enquiries by email become Salesforce Cases through the system API, with an acknowledgement sent back. No dedicated pattern matches an email trigger, so it gets the catch-all. Repository fgc/enquiry-mailbox-reader."
    parts:
      availability: avail-opening-hours
      recovery: rto-60-rpo-0
      retention: logs-30d
      parent: fgc-parent-pom
      deployment: fgc-ps-au
      error-handling: errs-framework
      payload: enquiry-email
      sample: enquiry-email-sample
      backend: email-connector
      secrets: mailbox-secrets
      observability: obs-mailbox
      idempotency: idem-message-id-imap
      volume: vol-10-per-day
      latency: lat-15min
      cadence: poll-5min-imap
      detection: detect-30min
  - id: register-enquiry
    kind: applicationFunction
    name: "Register Enquiry"
    description: "Mailbox size cap 5 GB; attachments over 10 MB skipped and noted on the Case — the trigger-specific NFRs the generic pattern cannot name."
  - id: call-mailbox-read
    kind: mule-connector-read
    name: "Read enquiries mailbox"
    description: "The message is the enquiry object as read; no mapping shapes it."
    parts:
      connector: email-connector
      object: enquiry-email
  - id: client-mailbox-sapi
    kind: mule-http-client
    name: "HTTP client → salesforce-patron-api (enquiries)"
    parts:
      api: salesforce-patron-api
      timeout: timeout-standard
      retry: retry-bounded
  - id: req-mailbox-create-case
    kind: mule-http-request
    name: "Call create case"
    description: "The email shaped into a case request; the case record comes back as it is and feeds the acknowledgement."
    parts:
      client: client-mailbox-sapi
      operation: op-sapi-create-case
      request-mapping: map-email-to-case
  - id: call-mailbox-send-ack
    kind: mule-connector-write
    name: "Send acknowledgement"
    parts:
      connector: email-connector
      object: ack-email
      write-mapping: map-case-to-ack
  - id: map-email-to-case
    kind: mapping-application-function
    name: "Map Email to Case Request"
    parts:
      source: enquiry-email
      target: case-request
      specification: spec-email-to-case
  - id: map-case-to-ack
    kind: mapping-application-function
    name: "Map Case Record to Acknowledgement"
    parts:
      source: case-record
      target: ack-email
      specification: spec-ack-email
  - id: enquiry-email
    kind: dataObject
    name: "Enquiry email"
  - id: enquiry-email-sample
    kind: sample-data-object
    name: "Enquiry email sample"
  # ── Contract and call objects that no application slot names ─────────────────────────────────────
  - id: greeting-view
    kind: dataObject
    name: "Greeting view"
    description: "What the tablet renders: headline, patron first name, membership tier badge, today's tee time. Shaped for a 10-inch screen; nothing the tablet does not show."
  - id: checkin-request
    kind: dataObject
    name: "Check-in request"
    description: "What the tablet sends: membershipNumber, tabletId, arrivedAt. The card tap, before anybody has looked the patron up."
  - id: membership-lookup
    kind: dataObject
    name: "Membership lookup"
    description: "membershipNumber, as the tablet asks and the process API forwards."
  - id: greeting-request
    kind: dataObject
    name: "Greeting request"
    description: "patronId and tabletId, for a screen that was refreshed."
  - id: patron-query
    kind: dataObject
    name: "Patron query"
    description: "The system API's lookup: membership number or patron id, and which fields."
  - id: attendance-record
    kind: dataObject
    name: "Attendance record"
    description: "The system API's request object for an attendance: Attendance_Key__c, patron id, arrivedAt, source tablet."
  - id: attendance-query
    kind: dataObject
    name: "Attendance query"
    description: "A date."
  - id: attendance-list
    kind: dataObject
    name: "Attendance list"
    description: "One day's attendances as the system API returns them."
  - id: purchase-record
    kind: dataObject
    name: "Purchase record"
    description: "The system API's request object for a pro-shop purchase."
  - id: case-request
    kind: dataObject
    name: "Case request"
    description: "The system API's request object for a guest enquiry: sender, subject, body, received."
  - id: case-record
    kind: dataObject
    name: "Case record"
    description: "Case number and status, as the system API returns them."
  - id: operation-ack
    kind: dataObject
    name: "Operation acknowledgement"
    description: "What every write operation of the system API returns: the Salesforce id and nothing else. Nothing maps it."
  - id: digest-email
    kind: dataObject
    name: "Digest email"
    description: "The message the Guest Services Manager receives at 06:00."
  - id: ack-email
    kind: dataObject
    name: "Acknowledgement email"
    description: "Case number and expected response time, sent back to the enquirer."
  - id: teams-card
    kind: dataObject
    name: "Teams greeting card"
    description: "Adaptive Card posted to the pro-shop channel: patron name, tier, arrival time, which tablet."
  - id: tee-sheet-row
    kind: dataObject
    name: "Tee sheet row"
    description: "One CSV row from the booking vendor's nightly export: booking reference, member number, tee time, players."
  # ── Mapping specifications. The field rows (source field → target field → expression) live in an
  # aperturex/mapping-spec/v1 document uploaded against the mapping; a model reference is a subject
  # id and never a document id, so the ARTIFACT is the model's name for that document, and the
  # document names the mapping it specifies. Until it is uploaded the product reports AX003.
  - id: spec-greeting-view
    kind: artifact
    name: "Greeting → tablet view mapping spec"
