format: yarramate/question-catalogue/v1
id: core-enrichment
version: "0.6"
profile: yarramate/core@0.1
presentation:
  title: Core enrichment interview
  description: >-
    The guided design path: motivation, business, application, technology,
    and implementation waves plus cross-cutting hygiene. Each question
    states the decision its answer changes; a question that cannot is
    deleted, not softened. Adequacy is enforced by linkage depth and
    attestation, never by reading words. Versioning is additive within a
    major version: every question records the catalogue version it arrived
    in (ADR 0063), and a completed interview honestly reopens when the
    path deepens.

waves:
  - id: motivation
    name: Motivation
    description: Why the system exists and what constrains it.
  - id: business
    name: Business
    description: Who acts, what is served, and what information matters.
  - id: application
    name: Application
    description: >-
      How declared services are realized, performed, and fed with
      information.
  - id: technology
    name: Technology
    description: >-
      Where the declared applications actually run and what materializes
      them.
  - id: implementation
    name: Implementation
    description: >-
      How the planned architecture becomes real: work, deliverables, and
      the plateaus between here and there.
  - id: hygiene
    name: Model hygiene
    description: Cross-cutting completeness that keeps every wave honest.

questions:
  # ---- motivation ----------------------------------------------------------
  - id: outcome-missing
    wave: motivation
    since: "0.1"
    scope: workspace
    trigger:
      - condition: no-subject-of-kind
        kinds:
          - yarramate/core@0.1#goal
          - yarramate/core@0.1#outcome
    question: >-
      What outcome justifies this system's existence?
    askPlain: >-
      What would success look like for this system? What should be
      different in the business because it exists?
    materiality: >-
      Without a declared goal or outcome, no alternative can be selected or
      rejected on grounds anyone can review; every later trade-off becomes
      taste.
    authority: human
    resolution: >-
      Add at least one goal or outcome concept and relate principal services
      to it with realization.

  - id: stakeholders-missing
    wave: motivation
    since: "0.1"
    scope: workspace
    trigger:
      - condition: no-subject-of-kind
        kinds:
          - yarramate/core@0.1#stakeholder
          - yarramate/core@0.1#driver
    question: >-
      Which stakeholders and drivers shape this architecture?
    askPlain: >-
      Who cares about this system, and what outside pressures are
      pushing on it: customers, regulators, costs, deadlines?
    materiality: >-
      Drivers decide which qualities dominate when requirements conflict;
      unstated drivers get re-litigated in every review.
    authority: human
    resolution: >-
      Add stakeholder and driver concepts; use influence relationships toward
      the goals they shape.

  - id: constraints-missing
    wave: motivation
    since: "0.1"
    scope: workspace
    trigger:
      - condition: no-subject-of-kind
        kinds:
          - yarramate/core@0.1#constraint
          - yarramate/core@0.1#requirement
    question: >-
      Which constraints and requirements are non-negotiable?
    askPlain: >-
      What are the hard rules here? Is there anything we absolutely
      must do, or must never do, no matter which option we pick?
    materiality: >-
      Non-negotiable constraints eliminate alternatives outright; discovering
      them after design selection invalidates the selection.
    authority: human
    resolution: >-
      Add constraint or requirement concepts and attach constraint references
      from the subjects they bind.

  - id: goal-unrealized
    wave: motivation
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#goal
        - yarramate/core@0.1#outcome
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#realization
        direction: incoming
    question: >-
      Nothing realizes {subject.name}. What fulfils it — or is it
      aspirational?
    askPlain: >-
      Nothing in the plan currently delivers "{subject.name}". What is
      going to get us there? Or is it more of an aspiration for now?
    materiality: >-
      An unrealized goal either reprioritizes the roadmap or should be
      declared aspirational so it stops steering design.
    authority: either
    resolution: >-
      Add realization relationships from the fulfilling capability or
      service, record the aspirational status in the goal's description,
      or retire the goal (status: retired) to record that it no longer
      steers design. A goal may also be authored retired from the start:
      status retired with the rationale in its description is the
      declared non-goal record, and exports render it under a Non-goals
      heading (ADR 0073).


  - id: goal-no-driver
    wave: motivation
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#goal
        - yarramate/core@0.1#outcome
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#influence
        direction: incoming
        counterpartKinds:
          - yarramate/core@0.1#driver
          - yarramate/core@0.1#assessment
          - yarramate/core@0.1#stakeholder
    question: >-
      What pressure produces {subject.name}?
    askPlain: >-
      Why is "{subject.name}" a goal at all? Who or what is pushing
      for it?
    materiality: >-
      A goal with no driver behind it cannot be reprioritized when the
      environment changes; it floats free of the forces that would retire
      or sharpen it.
    authority: human
    resolution: >-
      Add the driver, assessment, or stakeholder that motivates the goal
      and connect it with an influence relationship.

  - id: driver-influences-nothing
    wave: motivation
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#driver
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#influence
        direction: outgoing
    question: >-
      What does {subject.name} actually push on?
    askPlain: >-
      We say "{subject.name}" matters. What would we decide differently
      because of it? If nothing, does it belong in this conversation?
    materiality: >-
      A driver that influences nothing cannot participate in any trade-off;
      it is context theatre until it points at a goal or principle.
    authority: either
    resolution: >-
      Add influence relationships toward the goals, principles, or
      assessments the driver shapes, or remove it.

  - id: stakeholder-unconcerned
    wave: motivation
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#stakeholder
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#influence
          - yarramate/core@0.1#association
        direction: any
    question: >-
      What does {subject.name} care about here?
    askPlain: >-
      What does {subject.name} actually care about in all this? What
      would make them push back, and what would make them happy?
    materiality: >-
      A stakeholder with no stated concern cannot veto or endorse anything;
      their objections will arrive as surprises at review time.
    authority: human
    resolution: >-
      Relate the stakeholder to the goals or drivers they care about, or
      remove them from the model.

  - id: requirement-unrealized
    wave: motivation
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#requirement
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#realization
        direction: incoming
    question: >-
      Nothing realizes {subject.name}. What will fulfil it — or is it
      out of scope?
    askPlain: >-
      Who or what is going to make "{subject.name}" happen? Or should
      we agree to drop it?
    materiality: >-
      An unrealized requirement is either unplanned work hiding in plain
      sight or scope that should be explicitly declined; both change the
      roadmap.
    authority: either
    resolution: >-
      Add realization from the fulfilling service, component, or
      behavior; to descope instead, retire the requirement (status:
      retired) — retirement preserves the decision on record and closes
      the question (ADR 0064). Descoping at inception is the same
      motion: a requirement authored with status retired, rationale in
      its description, is the standing non-goal record and exports
      render it under a Non-goals heading (ADR 0073). Delete only when
      the history itself is noise.

  - id: principle-unapplied
    wave: motivation
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#principle
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#influence
          - yarramate/core@0.1#realization
        direction: any
    question: >-
      Where does {subject.name} bite?
    askPlain: >-
      Where does the principle "{subject.name}" actually change how we
      work? Can you point to a decision it has shaped, or would shape?
    materiality: >-
      A principle applied nowhere constrains nothing; naming what it
      influences is what makes it enforceable in review.
    authority: either
    resolution: >-
      Add influence relationships to the decisions the principle governs,
      or realization from the elements that embody it.

  - id: assessment-unlinked
    wave: motivation
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#assessment
    trigger:
      - condition: isolated
    question: >-
      What does the finding {subject.name} bear on?
    askPlain: >-
      We recorded the finding "{subject.name}". What does it actually
      tell us, and what should change because of it?
    materiality: >-
      An assessment that touches nothing changes no decision; link it to
      the driver or goal it evaluates or drop it.
    authority: either
    resolution: >-
      Relate the assessment to its driver or goal with influence or
      association.

  - id: motivation-unattested
    wave: motivation
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#goal
        - yarramate/core@0.1#outcome
        - yarramate/core@0.1#requirement
    trigger:
      - condition: missing-attestation
        topic: adequacy
    question: >-
      Has an accountable reviewer accepted {subject.name} as adequately
      stated?
    askPlain: >-
      Is everyone happy with how "{subject.name}" is written up? Who in
      this room is willing to put their name on it as correct?
    materiality: >-
      Linkage proves the wiring exists; only a recorded judgment says the
      words are right. Without an attestation, adequacy is nobody's
      decision on record.
    authority: human
    resolution: >-
      Review the subject's description and linkage, then record an
      attestation with topic "adequacy" (revoke by deleting it; Git
      reviews both).

  # ---- business ------------------------------------------------------------
  - id: service-consumer-unknown
    wave: business
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessService
        - yarramate/core@0.1#applicationService
        - yarramate/core@0.1#technologyService
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#serving
        direction: outgoing
    question: >-
      Who or what consumes {subject.name}?
    askPlain: >-
      Who actually uses "{subject.name}"? If we cannot name anyone,
      why do we offer it?
    materiality: >-
      A service with no consumer is either the system boundary stated
      implicitly, missing model detail, or scope to delete.
    authority: either
    resolution: >-
      Add serving relationships to the consuming actor, process, or
      component; if the consumer is external, model it as an actor.

  - id: owner-missing
    wave: business
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessService
        - yarramate/core@0.1#applicationService
        - yarramate/core@0.1#applicationComponent
        - yarramate/core@0.1#capability
    trigger:
      - condition: missing-claim
        predicate: yarramate/ownership/owner
    question: >-
      Who is accountable for {subject.name}?
    askPlain: >-
      If something goes wrong with "{subject.name}", whose desk does
      it land on?
    materiality: >-
      Ownership decides who accepts changes, budgets maintenance, and
      adjudicates constraint conflicts for the subject.
    authority: either
    resolution: >-
      Add an owner reference to an accountable actor (evidence such as
      CODEOWNERS may propose it; a human confirms accountability).

  - id: actor-unassigned
    wave: business
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessActor
        - yarramate/core@0.1#businessRole
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#assignment
        direction: outgoing
    question: >-
      What behavior is {subject.name} actually responsible for?
    askPlain: >-
      What does {subject.name} actually do in this picture? What work
      are they on the hook for day to day?
    materiality: >-
      An actor with no assignment is either decorative or hiding an
      undeclared responsibility boundary.
    authority: either
    resolution: >-
      Add assignment relationships to the processes, functions, or services
      the actor performs, or remove the actor.

  - id: information-unaccessed
    wave: business
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessObject
        - yarramate/core@0.1#dataObject
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#access
          - yarramate/core@0.1#realization
        direction: any
    question: >-
      Which behavior creates and maintains {subject.name}?
    askPlain: >-
      Where does "{subject.name}" come from? Who creates it, and who
      keeps it up to date?
    materiality: >-
      Information nothing accesses cannot be owned, persisted, or exchanged
      correctly; write responsibility determines consistency boundaries.
    authority: either
    resolution: >-
      Add access relationships (with modes) from the behavior that reads and
      writes it.

  - id: no-service-declared
    wave: business
    since: "0.1"
    scope: workspace
    trigger:
      - condition: no-subject-of-kind
        kinds:
          - yarramate/core@0.1#businessService
          - yarramate/core@0.1#applicationService
          - yarramate/core@0.1#technologyService
    question: >-
      What does this system offer its environment, and to whom?
    askPlain: >-
      In plain terms: what does this system do for people, and who are
      those people?
    materiality: >-
      Declared services define the solution boundary; without them the model
      cannot say what is inside versus outside.
    authority: human
    resolution: >-
      Add the externally meaningful services and serve them to their
      consumers.


  - id: service-realizes-no-motivation
    wave: business
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessService
        - yarramate/core@0.1#capability
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#realization
        direction: outgoing
        counterpartKinds:
          - yarramate/core@0.1#requirement
          - yarramate/core@0.1#goal
          - yarramate/core@0.1#outcome
    question: >-
      Which requirement or goal does {subject.name} exist to satisfy?
    askPlain: >-
      Why do we have "{subject.name}" at all? If we dropped it
      tomorrow, which goal or promise would suffer?
    materiality: >-
      A service with no motivation link cannot be traded off against
      anything; when budgets tighten nobody can say what breaks if it
      goes.
    authority: either
    resolution: >-
      Add realization from the service or capability to the requirement,
      goal, or outcome it satisfies.

  - id: process-untriggered
    wave: business
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessProcess
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#triggering
          - yarramate/core@0.1#assignment
        direction: incoming
    question: >-
      What starts {subject.name}?
    askPlain: >-
      How does "{subject.name}" get kicked off? Does somebody start
      it, or does something happen that sets it in motion?
    materiality: >-
      A process nothing triggers or performs either runs on an undeclared
      schedule or does not actually happen; both are design facts worth
      stating.
    authority: either
    resolution: >-
      Add the triggering event or the assignment from its performer.

  - id: business-service-unrealized
    wave: business
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessService
      statuses:
        - planned
        - current
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#realization
        direction: incoming
        counterpartKinds:
          - yarramate/core@0.1#businessProcess
          - yarramate/core@0.1#businessFunction
          - yarramate/core@0.1#applicationService
          - yarramate/core@0.1#applicationComponent
          - yarramate/core@0.1#capability
    question: >-
      What actually delivers {subject.name}?
    askPlain: >-
      We promise "{subject.name}". Walk me through how it actually
      gets delivered today, or how it will be.
    materiality: >-
      A business service with no realizing behavior or application is a
      promise with no mechanism; the gap is where delivery estimates go
      wrong.
    authority: either
    resolution: >-
      Add realization from the process, function, or application element
      that delivers it.


  # ---- application ---------------------------------------------------------
  - id: app-service-unrealized
    wave: application
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#applicationService
      statuses:
        - planned
        - current
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#realization
        direction: incoming
        counterpartKinds:
          - yarramate/core@0.1#applicationComponent
          - yarramate/core@0.1#applicationFunction
          - yarramate/core@0.1#applicationProcess
          - yarramate/core@0.1#applicationCollaboration
    question: >-
      Which component or behavior realizes {subject.name}?
    materiality: >-
      An application service with no realizer is interface without
      implementation; implementers cannot be handed a slice that names no
      mechanism.
    authority: either
    resolution: >-
      Add realization from the component, function, or process that
      implements the service.

  - id: component-realizes-nothing
    wave: application
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#applicationComponent
      statuses:
        - planned
        - current
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#realization
          - yarramate/core@0.1#assignment
        direction: outgoing
    question: >-
      What does {subject.name} contribute?
    materiality: >-
      A component that realizes and performs nothing is either missing its
      purpose links or is inventory the build does not need.
    authority: either
    resolution: >-
      Add realization to the services it implements or assignment to the
      behavior it performs, or remove it.

  - id: behavior-unassigned
    wave: application
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#applicationFunction
        - yarramate/core@0.1#applicationProcess
      statuses:
        - planned
        - current
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#assignment
        direction: incoming
        counterpartKinds:
          - yarramate/core@0.1#applicationComponent
          - yarramate/core@0.1#applicationCollaboration
          - yarramate/core@0.1#businessActor
          - yarramate/core@0.1#businessRole
    question: >-
      Who or what performs {subject.name}?
    materiality: >-
      Behavior with no performer cannot be placed in any component
      boundary; it will be implemented wherever the first builder happens
      to put it.
    authority: either
    resolution: >-
      Add assignment from the component, collaboration, or actor that
      performs the behavior.

  - id: event-triggers-nothing
    wave: application
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#applicationEvent
        - yarramate/core@0.1#businessEvent
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#triggering
        direction: outgoing
    question: >-
      What responds to {subject.name}?
    materiality: >-
      An event that triggers nothing is either an unhandled condition —
      a real design gap — or noise; deciding which changes the build.
    authority: either
    resolution: >-
      Add triggering to the responding process or function, or remove the
      event.

  - id: information-unowned
    wave: application
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#dataObject
        - yarramate/core@0.1#businessObject
    trigger:
      - condition: missing-claim
        predicate: yarramate/ownership/owner
    question: >-
      Who is accountable for {subject.name} — its meaning, retention, and
      access?
    materiality: >-
      Unowned information has no one to adjudicate schema changes,
      retention, or access disputes; ownership is where data governance
      starts.
    authority: human
    resolution: >-
      Add an owner reference to the accountable actor.

  - id: planned-design-unattested
    wave: application
    since: "0.3"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessService
        - yarramate/core@0.1#applicationService
        - yarramate/core@0.1#applicationComponent
      statuses:
        - planned
    trigger:
      - condition: missing-attestation
        topic: design-review
    question: >-
      Has the design of {subject.name} been reviewed before it is built?
    materiality: >-
      A planned element carries every unbuilt decision; a recorded
      design-review attestation is the difference between a reviewed
      intention and a hopeful one.
    authority: human
    resolution: >-
      Review the planned element's slice, then record an attestation with
      topic "design-review" (revoke by deleting it when the design
      changes).

  # ---- technology ----------------------------------------------------------
  - id: component-unhosted
    wave: technology
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#applicationComponent
      kindMatching: exact
      statuses:
        - planned
        - current
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#serving
          - yarramate/core@0.1#assignment
        direction: incoming
        counterpartKinds:
          - yarramate/core@0.1#node
          - yarramate/core@0.1#device
          - yarramate/core@0.1#systemSoftware
          - yarramate/core@0.1#technologyService
    question: >-
      Where does {subject.name} run?
    materiality: >-
      The hosting boundary decides latency, failure domain, scaling
      model, and data residency; a component with no declared runtime is
      deployed by whoever gets there first. Matching is exact by intent:
      profile-derived module kinds inherit their deployable parent's
      hosting rather than answering separately.
    authority: either
    resolution: >-
      Add the node, device, or system software that hosts it with a
      serving or assignment relationship into the component.

  - id: node-serves-nothing
    wave: technology
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#node
        - yarramate/core@0.1#device
        - yarramate/core@0.1#systemSoftware
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#serving
          - yarramate/core@0.1#assignment
        direction: outgoing
    question: >-
      What does {subject.name} host or serve?
    materiality: >-
      Declared infrastructure that serves nothing is either cost without
      purpose or missing the links that justify it; both change the
      deployment budget.
    authority: either
    resolution: >-
      Add serving or assignment relationships to the applications and
      behavior it hosts, or remove it.

  - id: technology-service-unrealized
    wave: technology
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#technologyService
      statuses:
        - planned
        - current
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#realization
        direction: incoming
        counterpartKinds:
          - yarramate/core@0.1#node
          - yarramate/core@0.1#systemSoftware
          - yarramate/core@0.1#technologyFunction
          - yarramate/core@0.1#technologyProcess
    question: >-
      What provides {subject.name}?
    materiality: >-
      A technology service with no realizing node or behavior is a
      dependency assumed rather than provided; outages and upgrades have
      no owner in the model.
    authority: either
    resolution: >-
      Add realization from the node, system software, or technology
      behavior that provides the service.

  - id: artifact-unassigned
    wave: technology
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#artifact
      kindMatching: exact
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#assignment
          - yarramate/core@0.1#realization
        direction: any
    question: >-
      What deploys {subject.name}, and what does it materialize?
    materiality: >-
      An artifact with no deployment target and nothing it realizes is a
      build output the architecture cannot place; release engineering
      starts from exactly these links.
    authority: either
    resolution: >-
      Assign the artifact to the node that deploys it and add realization
      to the component or data it materializes.

  # ---- implementation ------------------------------------------------------
  - id: workpackage-delivers-nothing
    wave: implementation
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#workPackage
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#realization
          - yarramate/core@0.1#aggregation
        direction: outgoing
    question: >-
      What does {subject.name} produce?
    materiality: >-
      Work with no deliverable cannot be accepted or declared done; the
      deliverable link is what makes progress reviewable rather than
      reported.
    authority: either
    resolution: >-
      Add realization from the work package to its deliverables.

  - id: workpackage-unassigned
    wave: implementation
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#workPackage
    trigger:
      - condition: missing-linkage
        kinds:
          - yarramate/core@0.1#assignment
        direction: incoming
        counterpartKinds:
          - yarramate/core@0.1#businessActor
          - yarramate/core@0.1#businessRole
    question: >-
      Who is committed to {subject.name}?
    materiality: >-
      An unassigned work package is a plan without capacity; commitment
      is the difference between a roadmap and a wish list.
    authority: human
    resolution: >-
      Add assignment from the actor or role that owns the work.

  - id: deliverable-realizes-nothing
    wave: implementation
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#deliverable
      kindMatching: exact
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#realization
        direction: outgoing
    question: >-
      What does {subject.name} make real?
    materiality: >-
      A deliverable that realizes no architecture element is effort
      disconnected from the design; its acceptance criteria cannot be
      stated architecturally.
    authority: either
    resolution: >-
      Add realization from the deliverable to the plateau, requirement,
      or element it brings into being.

  - id: plateau-aggregates-nothing
    wave: implementation
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#plateau
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#aggregation
          - yarramate/core@0.1#composition
        direction: outgoing
    question: >-
      Which architecture does {subject.name} stabilize?
    materiality: >-
      A plateau that aggregates nothing describes no state anyone can
      stand on; migration planning needs to know what is stable when.
    authority: either
    resolution: >-
      Aggregate the elements that are current during this plateau, or use
      architecture states instead and remove it.

  - id: gap-unaddressed
    wave: implementation
    since: "0.4"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#gap
    trigger:
      - condition: missing-relationship
        kinds:
          - yarramate/core@0.1#association
          - yarramate/core@0.1#realization
        direction: any
    question: >-
      What closes {subject.name}?
    materiality: >-
      A named gap nothing addresses is a known risk with no plan; either
      work closes it or the acceptance of it should be on record.
    authority: human
    resolution: >-
      Associate the gap with the plateaus it separates and the
      deliverable that closes it, or record the decision to accept it.

  # ---- hygiene -------------------------------------------------------------
  - id: concept-isolated
    wave: hygiene
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#capability
        - yarramate/core@0.1#businessService
        - yarramate/core@0.1#applicationService
        - yarramate/core@0.1#applicationComponent
        - yarramate/core@0.1#businessActor
        - yarramate/core@0.1#dataObject
        - yarramate/core@0.1#businessObject
    trigger:
      - condition: isolated
    question: >-
      {subject.name} relates to nothing. How does it participate in the
      architecture — or should it be removed?
    materiality: >-
      An isolated concept either misses relationships the design depends on
      or inflates the model with noise that dilutes trust.
    authority: either
    resolution: >-
      Connect it with its real relationships or delete it; do not keep
      unexplained inventory.

  - id: concept-undescribed
    wave: hygiene
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessService
        - yarramate/core@0.1#applicationService
        - yarramate/core@0.1#applicationComponent
        - yarramate/core@0.1#capability
        - yarramate/core@0.1#dataObject
    trigger:
      - condition: missing-claim
        predicate: yarramate/concept/description
    question: >-
      What does {subject.name} mean — and what does it deliberately not
      include?
    materiality: >-
      Undescribed subjects accumulate contradictory interpretations; the
      description is where scope disputes are settled once.
    authority: either
    resolution: >-
      Add a description claim stating meaning and explicit exclusions.

  - id: status-missing
    wave: hygiene
    since: "0.1"
    scope: subject
    subjects:
      kinds:
        - yarramate/core@0.1#businessService
        - yarramate/core@0.1#applicationService
        - yarramate/core@0.1#applicationComponent
        - yarramate/core@0.1#capability
    trigger:
      - condition: missing-claim
        predicate: yarramate/lifecycle/status
    question: >-
      Is {subject.name} current, planned, or retired?
    materiality: >-
      Lifecycle status separates the architecture that exists from the one
      that is intended; conflating them corrupts both discovery and design.
    authority: either
    resolution: >-
      Add a lifecycle status claim; planned subjects should also appear in a
      target architecture state where states are used.

  - id: states-undefined
    wave: hygiene
    since: "0.1"
    scope: workspace
    trigger:
      - condition: no-state-defined
    question: >-
      Does change shape matter here — should baseline, transition, or target
      states be declared?
    materiality: >-
      Without architecture states, current and target intent share one
      undifferentiated model and comparisons are impossible.
    authority: human
    resolution: >-
      Declare architecture states and mark presence with present-in where the
      distinction carries decisions; explicitly decline states otherwise.
