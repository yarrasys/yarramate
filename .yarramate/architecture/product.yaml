format: yarramate/v1
id: yarramate-product
profile: yarramate/core@0.1
concepts:
  - id: yarramate-maintainers
    kind: businessActor
    name: YarraMate maintainers
    description: People accountable for stewardship of the YarraMate Core repository.
  - id: agent-harness
    kind: businessActor
    name: Agent harness
    description: Automated coding or architecture agent that orchestrates the stable CLI and consumes its machine-readable contracts.
  - id: adopting-team
    kind: businessActor
    name: Adopting team
    description: People applying YarraMate to their own repository and reviewing its proposals through Git.
  - id: architecture-drift
    kind: driver
    name: Architecture drift
    description: Architecture documentation decays away from implementation when it is not deterministic and checkable.
  - id: trustworthy-agent-context
    kind: driver
    name: Trustworthy agent context
    description: Agents abandon architecture context they cannot verify as current and correct.
  - id: repository-stewardship
    kind: businessFunction
    name: Repository stewardship
    description: Review, merge, and ADR governance for the YarraMate repository as described in GOVERNANCE.md.
  - id: shared-architecture-context
    kind: goal
    name: Shared architecture context
    description: People and agents work from the same structured architectural meaning.
  - id: repository-native-operation
    kind: requirement
    name: Repository-native operation
    description: Git supplies authorship, review, history, and approval.
  - id: tool-neutral-core
    kind: requirement
    name: Tool-neutral core
    description: Core remains independent of authoring, visualization, evidence, and compatibility adapters.
  - id: native-documents-are-canonical
    kind: requirement
    name: Native documents are canonical
    description: Versioned YarraMate documents are the committed semantic source of truth.
  - id: deterministic-correctness
    kind: requirement
    name: Deterministic correctness
    description: Core validation checks reproducible correctness rather than taste or completeness.
  - id: stable-cli
    kind: requirement
    name: Stable CLI
    description: Humans, CI, skills, and agent harnesses share one command interface.
  - id: evidence-intent-separation
    kind: requirement
    name: Evidence and intent remain distinct
    description: Observations may support or challenge architecture proposals but cannot silently author declared intent.
    references:
      - id: governing-decisions
        ref: yarramate-repository#architecture-decisions
  - id: compile-native-architecture
    kind: capability
    name: Compile native architecture
    description: Turn declared native documents into the deterministic tool-neutral semantic graph.
    owner: yarramate-maintainers
    status: current
  - id: validate-native-architecture
    kind: capability
    name: Validate native architecture
    description: Check deterministic correctness of declared architecture; never completeness or taste.
    owner: yarramate-maintainers
    status: current
  - id: provide-machine-context
    kind: capability
    name: Provide machine-readable context
    description: Serve bounded, verifiable slices of declared architecture to people, CI, and agent harnesses.
    owner: yarramate-maintainers
    status: current
  - id: evaluate-architecture-evidence
    kind: capability
    name: Evaluate architecture evidence
    description: Compare provider observations with existing semantic subjects and claims without changing canonical intent.
    owner: yarramate-maintainers
    status: current
  - id: discover-project-architecture
    kind: capability
    name: Discover project architecture
    description: Guide an agent harness from existing project evidence to a reviewable native architecture proposal.
    owner: yarramate-maintainers
    status: current
  - id: design-solution-before-build
    kind: capability
    name: Design solution before build
    description: Guide people and an agent harness from intent and alternatives to a reviewable target solution.
    owner: yarramate-maintainers
    status: current
  - id: reconcile-intent-and-evidence
    kind: capability
    name: Reconcile intent and evidence
    description: Compare declared architecture with provider observations without allowing evidence to mutate intent.
    owner: yarramate-maintainers
    status: current
relationships:
  - id: repository-operation-supports-context
    kind: influence
    from: repository-native-operation
    to: shared-architecture-context
  - id: canonical-documents-support-context
    kind: influence
    from: native-documents-are-canonical
    to: shared-architecture-context
  - id: correctness-supports-context
    kind: influence
    from: deterministic-correctness
    to: shared-architecture-context
  - id: cli-supports-context
    kind: influence
    from: stable-cli
    to: shared-architecture-context
  - id: discovery-supports-context
    kind: influence
    from: discover-project-architecture
    to: shared-architecture-context
  - id: design-supports-context
    kind: influence
    from: design-solution-before-build
    to: shared-architecture-context
  - id: reconciliation-supports-context
    kind: influence
    from: reconcile-intent-and-evidence
    to: shared-architecture-context
  - id: evidence-separation-supports-discovery
    kind: association
    from: evidence-intent-separation
    to: discover-project-architecture
    description: Discovery may propose declared architecture from evidence, but evidence never becomes accepted intent without Git review.
    references:
      - id: shared-context-effect
        ref: discovery-supports-context
  - id: evidence-separation-supports-reconciliation
    kind: association
    from: evidence-intent-separation
    to: reconcile-intent-and-evidence
    description: Reconciliation reports where evidence challenges declared architecture without rewriting the accepted intent.
    references:
      - id: governing-decisions
        ref: yarramate-repository#architecture-decisions
  - id: cli-supports-discovery
    kind: association
    from: stable-cli
    to: discover-project-architecture
    description: Agent harnesses use the stable CLI to produce reviewable discovery proposals without a privileged agent API.
    references:
      - id: implementation-interface
        ref: yarramate-engine#cli
  - id: cli-supports-design
    kind: association
    from: stable-cli
    to: design-solution-before-build
    description: Agent harnesses use the same stable CLI to capture design intent before implementation begins.
    references:
      - id: implementation-interface
        ref: yarramate-engine#cli
  - id: maintainers-perform-stewardship
    kind: assignment
    from: yarramate-maintainers
    to: repository-stewardship
  - id: harness-performs-discovery
    kind: assignment
    from: agent-harness
    to: discover-project-architecture
  - id: harness-performs-design
    kind: assignment
    from: agent-harness
    to: design-solution-before-build
  - id: adopting-team-performs-design
    kind: assignment
    from: adopting-team
    to: design-solution-before-build
  - id: drift-drives-shared-context
    kind: influence
    from: architecture-drift
    to: shared-architecture-context
  - id: agent-trust-drives-shared-context
    kind: influence
    from: trustworthy-agent-context
    to: shared-architecture-context
  - id: machine-context-realizes-shared-context
    kind: realization
    from: provide-machine-context
    to: shared-architecture-context
