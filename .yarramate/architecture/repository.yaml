concepts:
  - id: product-contract
    kind: deliverable
    name: Product contract
  - id: architecture-decisions
    kind: representation
    name: Architecture decision records
    description: The decisions as reviewable documents. A representation, not a deliverable - each records why; the merged work realizes it.
  - id: roadmap
    kind: representation
    name: Product roadmap
    description: The staged product plan as a reviewable document. A representation, not a deliverable - it describes the evolution; the merged work realizes it.
  - id: backlog-disposition
    kind: representation
    name: Backlog disposition
    description: Distinguishes completed local scope from decision-gated, externally blocked, and demand-gated future work.
  - id: product-journeys-guide
    kind: deliverable
    name: Product journey guide
    description: Defines the shared discovery and architecture-first design lifecycle.
  - id: consumer-guide
    kind: deliverable
    name: Consumer installation guide
    description: Defines local package installation and canonical skill discovery for agent harnesses.
  - id: consumer-package
    kind: artifact
    name: YarraMate consumer package
    description: Narrow installable boundary containing the built runtime, normative schemas, consumer guide, and canonical agent skill.
    status: current
  - id: likec4-adapter-prototype
    kind: applicationComponent
    name: LikeC4 adapter prototype
    description: Optional validated vocabulary and visualization prototype, superseded by the shipped LikeC4 adapter.
    owner: yarramate-maintainers
    status: retired
